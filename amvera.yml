# Конфигурация Amvera. Структура — как её записывает панель Amvera (коммит 20e1309), значения — наши:
# в проекте npm (package-lock.json, .npmrc), Next.js нужно собрать перед запуском.
# Переменные окружения на этапе сборки недоступны — всё нужное для сборки лежит в lib/site.ts.
# Не редактируйте конфигурацию в интерфейсе Amvera: панель перезаписывает этот файл своими значениями.
meta:
  environment: nodejs
  toolchain:
    name: npm
    version: 22
build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    '*': /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  # Порт задан явно: Amvera выставляет PORT=80, а next start слушает PORT — без -p порт разойдётся с containerPort
  command: npm run start -- -p 3000
  persistenceMount: /data
  containerPort: 3000
  singleton: true
  zeroDowntime: false
